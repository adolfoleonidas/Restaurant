<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10201a">
<title>RestoFlow — Salón, pedidos, cocina y caja</title>
<meta name="description" content="RestoFlow: mesas por zonas, pedidos, cocina y caja en un solo archivo, pensado primero para el celular.">
<meta property="og:title" content="RestoFlow — Salón, pedidos, cocina y caja">
<meta property="og:description" content="Mesas con estados claros, pedidos y cobros desde el celular.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<style>
/* =========================================================
   Tokens (una sola fuente de verdad, claro + oscuro)
   ========================================================= */
:root{
  --bg:#f3f5f4;--sf:#ffffff;--sf2:#eef2f0;--tx:#10201a;--mut:#5c6f66;--bd:#e2e7e4;
  --pri:#0b8a5f;--prit:#ffffff;--priw:#e2f5ec;
  --nav:#10201a;--nav-tx:#ffffff;--nav-mut:#a9bdb3;
  --libre:#3f9a74;--ocupada:#2563eb;--listo:#d97706;--cobrar:#c2410c;--reservada:#64748b;--bad:#dc2626;
  --on-c:#ffffff;
  --r:10px;--sh:0 1px 2px rgba(16,32,26,.06),0 6px 18px rgba(16,32,26,.06);
  --font-h:Sora,system-ui,sans-serif;--font-b:Manrope,system-ui,sans-serif;
  --tab:64px;--safe:env(safe-area-inset-bottom,0px);--hdr:calc(48px + env(safe-area-inset-top,0px));
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1411;--sf:#17201c;--sf2:#1f2a25;--tx:#e9f1ed;--mut:#93a69c;--bd:#2b3832;
  --pri:#2fb98a;--prit:#06281c;--priw:#10362a;--nav:#0a0f0d;
  --libre:#4ade80;--ocupada:#60a5fa;--listo:#fbbf24;--cobrar:#fb923c;--reservada:#94a3b8;--bad:#f87171;
  --on-c:#0e1411;--sh:none;
}}
:root[data-theme="dark"]{
  --bg:#0e1411;--sf:#17201c;--sf2:#1f2a25;--tx:#e9f1ed;--mut:#93a69c;--bd:#2b3832;
  --pri:#2fb98a;--prit:#06281c;--priw:#10362a;--nav:#0a0f0d;
  --libre:#4ade80;--ocupada:#60a5fa;--listo:#fbbf24;--cobrar:#fb923c;--reservada:#94a3b8;--bad:#f87171;
  --on-c:#0e1411;--sh:none;
}

/* =========================================================
   Base (mobile first)
   ========================================================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 var(--font-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ocupada);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-h);font-weight:600}
.mut{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Cabecera ---------- */
header{position:sticky;top:0;z-index:20;height:var(--hdr);background:var(--nav);color:var(--nav-tx);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-family:var(--font-h);font-size:17px;font-weight:700}
.logo{width:28px;height:28px;border-radius:7px;background:var(--pri);color:var(--prit);display:grid;place-items:center;font-weight:800;flex:none}
.consumption{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--nav-mut);white-space:nowrap}
.consumption strong{color:var(--nav-tx);font-variant-numeric:tabular-nums}
.consumption i{width:6px;height:6px;border-radius:50%;background:var(--libre)}
.sync{display:none;font-size:12px;color:var(--nav-mut);white-space:nowrap}

/* ---------- Navegación: barra inferior en móvil ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px var(--safe);height:calc(var(--tab) + var(--safe));border-top:1px solid color-mix(in srgb,var(--nav-tx) 10%,transparent)}
nav button{border:0;background:transparent;color:var(--nav-mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;position:relative;min-width:0}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--nav-tx);background:color-mix(in srgb,var(--nav-tx) 10%,transparent)}
nav .sec{display:none}
.bdg{background:var(--listo);color:#1a1206;border-radius:99px;font-size:11px;font-weight:800;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
nav .bdg{position:absolute;top:4px;left:calc(50% + 6px)}
.bdg:empty{display:none}

main{padding:18px 16px calc(var(--tab) + var(--safe) + 24px);max-width:1200px;margin:0 auto}
main.has-bar{padding-bottom:calc(var(--tab) + var(--safe) + 96px)}

/* ---------- Botones / chips ---------- */
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:12px;min-height:46px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,background .12s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--prit)}
.btn.warn{background:var(--listo);border-color:var(--listo);color:#1a1206}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn.icon{width:44px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--sf);border-color:var(--tx)}
.seg{display:inline-flex;gap:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:4px}
.seg .chip{border:0;background:transparent}
.seg .chip.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(20,30,45,.12)}
.search,.select{width:100%;border:1px solid var(--bd);background:var(--sf);border-radius:12px;min-height:46px;padding:0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--c);color:var(--on-c);white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid var(--bd)}
.card h3{font-size:16px;margin-bottom:8px}
.scroll-x{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.scroll-x::-webkit-scrollbar{display:none}

/* ---------- Barra de acciones fija (móvil) ---------- */
.actbar{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--safe));z-index:18;background:var(--sf);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:10px 16px;display:flex;gap:10px}
.actbar .btn{flex:1;min-height:52px}

/* =========================================================
   Salón
   ========================================================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.page-head h1{font-size:24px;line-height:1.2}
.page-head p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.salon-tools{display:grid;gap:10px;margin-bottom:20px}
.status-filters .chip{display:inline-flex;align-items:center;gap:7px}
.status-filters .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.status-filters .chip .n{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.toolbar .search{grid-column:1/-1}
.zone-section{margin-bottom:26px}
.zone-heading{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.zone-heading h2{font-size:17px}
.zone-heading span{margin-left:auto;color:var(--mut);font-size:12px}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);min-height:132px;display:flex;position:relative;overflow:hidden}
.t:not(.free){border-color:color-mix(in srgb,var(--c) 45%,var(--bd));box-shadow:0 10px 26px -18px var(--c)}
.t::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.t.free::before{opacity:.35}
.table-open{border:0;background:transparent;color:inherit;padding:14px 14px 14px 16px;text-align:left;display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}
.t b{font-family:var(--font-h);font-size:16px;font-weight:600}
.t .cap{font-size:12px;color:var(--mut)}
.t .st{font-size:13px;font-weight:800;color:var(--c);margin-top:auto}
.t .amt{font-size:12px;color:var(--mut);font-weight:600}
.t.ready .st::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-left:6px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}}
.t.joined{grid-column:span 2}
.t .subs{display:flex;gap:5px;flex-wrap:wrap}
.t .subs span{min-width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:800;background:var(--sf2);border:1px solid var(--bd)}
.t .subs span.m{background:var(--c);border-color:var(--c);color:var(--on-c)}
.elapsed.warn{color:var(--cobrar);font-weight:800}.elapsed.late{color:var(--bad);font-weight:800}

/* ---------- Detalle de mesa ---------- */
.detail-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;margin-bottom:14px}
.detail-head h2{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state-line{color:var(--c);font-weight:800;font-size:13px}
.detail{display:grid;gap:14px}
.summary{display:grid;gap:10px}
.summary .kv{display:flex;justify-content:space-between;gap:10px}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:800;border-top:1px dashed var(--bd);padding-top:10px}
.orders{display:grid;gap:10px}
.order{border:1px solid var(--bd);background:var(--sf);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.order-who{display:flex;align-items:center;gap:4px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.order-items{display:grid;gap:5px}
.order-item{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.order-item span{min-width:0;overflow-wrap:anywhere}
.order-item em{color:var(--cobrar);font-style:normal;font-size:12px;font-weight:700}
.order-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px dashed var(--bd)}
.nt{background:color-mix(in srgb,var(--cobrar) 12%,transparent);color:var(--cobrar);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700}
details.more{border:1px solid var(--bd);border-radius:12px;background:var(--sf2)}
details.more summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"⌄";transition:transform .15s}
details.more[open] summary::after{transform:rotate(180deg)}
details.more[open] summary{border-bottom:1px solid var(--bd)}
details.more .moreb{padding:12px 14px;display:grid;gap:8px}

/* =========================================================
   Toma de pedido (catálogo + ticket)
   ========================================================= */
.pos{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.pos>section,.detail>section{min-width:0}
.poshead{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;margin-bottom:12px}
.poshead h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--priw);color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 30%,transparent);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:12px;font-size:14px}
.person .btn{background:var(--sf);color:var(--tx)}
.cats{margin:10px -16px 12px}
.prods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.p{border:1px solid var(--bd);background:var(--sf);border-radius:var(--r);padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative;transition:border-color .12s}
.p:active{transform:scale(.98)}
.p.in{border-color:var(--pri)}
.p strong{font-size:14px;padding-right:22px;line-height:1.3}
.p .q{position:absolute;top:8px;right:8px;background:var(--pri);color:var(--prit);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:800}
.ticket{background:var(--sf);padding:16px 16px calc(16px + var(--safe));display:flex;flex-direction:column;gap:12px;border:1px solid var(--bd);position:fixed;left:0;right:0;bottom:0;max-height:88dvh;z-index:30;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.ticket.open{transform:none}
.ticket .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket .head h3{font-size:17px}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:29;display:none}
.scrim.on{display:block}
.lines{overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:40px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--sf2)}
.line .nm{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.line .nm small{display:block;color:var(--cobrar);font-size:12px;font-weight:700}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);font-weight:800;font-size:17px}
.stepper b{min-width:20px;text-align:center}
.sent{background:var(--sf2);border-radius:10px;padding:10px;font-size:13px;display:grid;gap:4px}
.sent .row{justify-content:space-between;flex-wrap:nowrap}
.note{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;resize:none;background:var(--sf)}
.acts{display:grid;gap:8px}
.fab{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + var(--safe) + 10px);z-index:19;justify-content:space-between;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

/* =========================================================
   Cocina
   ========================================================= */
.kds{display:grid;grid-template-columns:1fr;gap:12px}
.kt{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:14px;border:1px solid var(--bd);border-top:6px solid var(--c);display:flex;flex-direction:column;gap:8px}
.kt .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kt .h b{font-family:var(--font-h);font-size:19px}
.kt ul{margin:0;padding:0;list-style:none;font-size:16px;font-weight:600}
.kt li{padding:5px 0;border-bottom:1px solid var(--sf2);line-height:1.35}
.kt li em{color:var(--cobrar);font-style:normal;font-weight:700;font-size:14px}
.kt.late{--c:var(--bad)!important}
.kt .wait{text-align:center;padding:10px;border-radius:12px;background:var(--sf2);font-weight:700;color:var(--mut);font-size:14px}

/* =========================================================
   Caja / Admin / Ajustes / Más
   ========================================================= */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.kpi{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:14px;border:1px solid var(--bd)}
.kpi b{display:block;font-size:20px;margin-top:4px;font-family:var(--font-h)}
.sec-title{font-size:18px;margin:0 0 10px}
.paylist{display:grid;gap:10px;margin-bottom:22px}
.paycard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 14px;background:var(--sf);border:1px solid var(--bd);padding:14px;border-radius:var(--r);box-shadow:var(--sh)}
.paycard .acts2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paycard .amt{text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 4px;border-bottom:1px solid var(--sf2);text-align:left}
td.r{text-align:right}
.grid2{display:grid;gap:14px}
.menu-list{display:grid;gap:10px;margin:10px 0}
.menu-row{display:grid;grid-template-columns:1fr 92px;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf2)}
.menu-row input[type=text],.menu-row input[type=number]{width:100%;min-height:40px;border:1px solid var(--bd);border-radius:8px;padding:0 10px;background:var(--sf)}
.menu-row .name{grid-column:1/-1}
.menu-row .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.menu-row label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.menu-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
.settings{display:grid;gap:10px}
.setting{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;gap:14px;align-items:center;box-shadow:var(--sh)}
.setting.stack{flex-direction:column;align-items:flex-start}
.switch{width:50px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--mut) 40%,transparent);position:relative;border:0;padding:0;flex:none;transition:background .15s}
.switch::after{content:"";width:24px;height:24px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch.on{background:var(--pri)}
.switch.on::after{left:23px}
.more-list{display:grid;gap:10px}
.more-item{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.more-item .ic{font-size:22px;width:40px;height:40px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.more-item b{display:block;font-size:15px}
.more-item::after{content:"›";margin-left:auto;font-size:22px;color:var(--mut)}

/* ---------- QR ---------- */
.qrwrap{display:grid;gap:14px}
.qr-side{display:grid;gap:10px}
.mobile-shell{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.mobile-top{padding:16px 16px 8px}
.mobile-top h2{margin:4px 0 0;font-size:20px}
.qr-products{padding:8px 12px 12px;display:grid;gap:8px}
.qr-product{border:1px solid var(--bd);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.qr-bottom{padding:12px;border-top:1px solid var(--bd);background:var(--sf);position:sticky;bottom:0}

/* =========================================================
   Modales (hoja inferior en móvil)
   ========================================================= */
.back{position:fixed;inset:0;background:rgba(10,20,15,.5);display:none;align-items:flex-end;justify-content:center;z-index:40;backdrop-filter:blur(3px)}
.back.on{display:flex}
.modal{background:var(--sf);border-radius:20px 20px 0 0;width:100%;padding:18px 16px calc(18px + var(--safe));display:flex;flex-direction:column;gap:14px;max-height:92dvh;overflow:auto;border:1px solid var(--bd)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal h2{font-size:19px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{min-height:50px;border-radius:12px;border:2px solid var(--bd);background:var(--sf);font-weight:700;font-size:14px}
.methods button.on{border-color:var(--pri);background:var(--priw)}
.cash{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.field input{width:100%;min-height:50px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;font-size:18px;background:var(--sf)}
.big-total{font-size:34px;font-weight:800;text-align:center;font-family:var(--font-h)}
.partial{font-size:13px;color:var(--mut);text-align:center}
.splitrows{display:grid;gap:8px}
.splitrows .btn{justify-content:space-between}
.joinlist{display:grid;gap:8px}
.joinlist .btn{justify-content:space-between}

/* ---------- Toast (arriba, no tapa la zona de acciones) ---------- */
.toast{position:fixed;left:12px;right:12px;top:calc(var(--hdr) + 10px);transform:translateY(-12px);opacity:0;pointer-events:none;background:#10201a;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;z-index:60;transition:transform .22s,opacity .22s;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.toast.on{transform:translateY(0);opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#6ee7b7;font-weight:800;padding:6px}

/* =========================================================
   ≥ 600px (tablet vertical)
   ========================================================= */
@media(min-width:600px){
  main{padding-left:24px;padding-right:24px}
  .scroll-x{margin:0;padding:2px 0 4px;flex-wrap:wrap}
  .cats{margin:10px 0 12px}
  .tables{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .prods{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kds{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .toolbar{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto}
  .toolbar .search{grid-column:auto}
  .settings{grid-template-columns:1fr 1fr}
  .paycard{grid-template-columns:minmax(0,1fr) auto auto}
  .paycard .acts2{grid-column:auto;display:flex}
  .menu-row{grid-template-columns:1fr 2fr 100px auto;align-items:center}
  .menu-row .name{grid-column:auto}
  .menu-row .foot{grid-column:auto;gap:10px}
  .back{align-items:center;padding:16px}
  .modal{border-radius:18px;width:min(460px,100%);padding:20px}
  .toast{left:50%;right:auto;transform:translate(-50%,-12px);max-width:560px}
  .toast.on{transform:translate(-50%,0)}
  .qr-products{max-height:none}
}

/* =========================================================
   ≥ 820px (escritorio): nav arriba, detalle a dos columnas
   ========================================================= */
@media(min-width:820px){
  :root{--hdr:52px}
  header{padding:12px 24px;gap:20px}
  .brand{flex:none}
  nav{position:static;display:flex;gap:4px;height:auto;padding:0;background:transparent;border:0;flex:1}
  nav button{flex-direction:row;font-size:13px;padding:9px 12px;border-radius:999px;gap:8px}
  nav button .ic{font-size:15px}
  nav .sec{display:flex}
  nav .more-btn{display:none}
  nav .bdg{position:static}
  .sync{display:inline}
  main,main.has-bar{padding:32px 32px 60px}
  .page-head h1{font-size:30px}
  .tables{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .t{min-height:144px}
  .detail{grid-template-columns:minmax(0,1.4fr) minmax(280px,.65fr);gap:18px}
  .pos{grid-template-columns:minmax(0,1fr) 380px}
  .summary,.ticket{position:sticky;top:calc(var(--hdr) + 12px)}
  .detail-head h2{font-size:24px}
  .ticket{transform:none;left:auto;right:auto;bottom:auto;z-index:auto;border-radius:var(--r);max-height:calc(100vh - 110px);box-shadow:var(--sh);padding:16px}
  .ticket .close,.fab,.scrim{display:none!important}
  .actbar{position:static;padding:0;border:0;box-shadow:none;background:transparent;flex-direction:column}
  .prods{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .kds{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .grid2{grid-template-columns:1.4fr 1fr;align-items:start}
  .qrwrap{grid-template-columns:320px 380px;justify-content:center;align-items:start}
  .mobile-shell{border:10px solid #10201a;border-radius:34px;min-height:640px}
  .toast{top:calc(var(--hdr) + 12px)}
}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo" aria-hidden="true">R</div><span>RestoFlow</span></div>
  <nav id="nav" aria-label="Secciones">
    <button data-v="salon"><span class="ic" aria-hidden="true">▦</span>Salón<span class="bdg" id="bReady"></span></button>
    <button data-v="mostrador"><span class="ic" aria-hidden="true">🛍</span>Llevar</button>
    <button data-v="cocina"><span class="ic" aria-hidden="true">🔥</span>Cocina<span class="bdg" id="bKitchen"></span></button>
    <button data-v="caja"><span class="ic" aria-hidden="true">💵</span>Caja<span class="bdg" id="bCash"></span></button>
    <button data-v="qr" class="sec"><span class="ic" aria-hidden="true">▣</span>QR cliente</button>
    <button data-v="admin" class="sec"><span class="ic" aria-hidden="true">☰</span>Carta</button>
    <button data-v="settings" class="sec"><span class="ic" aria-hidden="true">⚙</span>Ajustes</button>
    <button data-v="more" class="more-btn"><span class="ic" aria-hidden="true">⋯</span>Más</button>
  </nav>
  <span class="consumption" aria-label="Consumo en mesas"><i aria-hidden="true"></i><strong id="salonConsumption">S/ 0.00</strong><span>en mesas</span></span>
  <span class="sync" id="sync">● Local</span>
</header>
<main id="view"></main>

<!-- Modal: cobro -->
<div class="back" id="payBack">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="payT">
    <div class="modal-head"><h2 id="payT">Cobrar</h2><button class="btn ghost icon" data-a="pay-close" aria-label="Cerrar">✕</button></div>
    <div class="big-total num" id="payTotal"></div>
    <div class="partial" id="payPartial"></div>
    <div class="methods" id="payMethods"></div>
    <div id="cashBox">
      <div class="field"><label class="mut" for="cashIn">Recibido</label><input id="cashIn" type="number" inputmode="decimal" min="0" step="0.1"></div>
      <div class="cash" id="cashQuick"></div>
      <div class="num" id="change" style="margin-top:8px;font-size:16px"></div>
    </div>
    <button class="btn pri big" data-a="pay-ok" id="payOk">Confirmar pago</button>
  </div>
</div>

<!-- Modal: elegir qué cobrar (solo si hay varios comensales) -->
<div class="back" id="splitBack">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="splitT">
    <div class="modal-head"><h2 id="splitT">¿Qué vas a cobrar?</h2><button class="btn ghost icon" data-a="split-close" aria-label="Cerrar">✕</button></div>
    <div id="splitBody"></div>
  </div>
</div>

<!-- Modal: unir mesa -->
<div class="back" id="joinBack">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="joinT">
    <div class="modal-head"><h2 id="joinT">Unir otra mesa</h2><button class="btn ghost icon" data-a="join-close" aria-label="Cerrar">✕</button></div>
    <div id="joinList" class="joinlist"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="undo">Deshacer</button></div>

<script>
'use strict';
/* ================================================================
   RestoFlow Pro v3 — flujo optimizado para el mozo.
   Integra: POS de dos paneles + cobro con vuelto + mostrador + admin
   (restoflow v2) con salón filtrable, zonas, unión de mesas, reservas,
   comensales, división de cuenta, QR, tema y accesibilidad (v1/Salón).
   ================================================================ */
const $=s=>document.querySelector(s);
const money=n=>'S/ '+(Math.round(Number(n||0)*100)/100).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const mins=t=>Math.floor((now()-t)/60000);
const hhmm=t=>new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
const KEY='restoflow.pro.v3';
const METHODS=['Efectivo','Yape','Plin','Tarjeta','Transferencia'];

/* ---------- Estado ---------- */
function seed(){
  const menu=[
    ['Entradas','Causa limeña',18],['Entradas','Papa a la huancaína',15],['Entradas','Tequeños',16],
    ['Fondos','Lomo saltado',38],['Fondos','Ají de gallina',30],['Fondos','Arroz con pollo',28],['Fondos','Ceviche clásico',35],
    ['Bebidas','Chicha morada (jarra)',15],['Bebidas','Inca Kola 500ml',6],['Bebidas','Agua mineral',4],['Bebidas','Limonada',10],
    ['Postres','Suspiro limeño',12],['Postres','Picarones',14]
  ].map(([cat,name,price])=>({id:uid(),cat,name,price,on:true}));
  const tables=Array.from({length:12},(_,i)=>({id:i+1,zone:i<8?'Salón':'Terraza',seats:i<8?4:6,reserved:null}));
  // Demo viva: mesa 2 con pedidos en cocina+listo, mesa 4 lista para cobrar, mesa 6 reservada.
  const t2={id:uid(),kind:'mesa',refs:[2],label:'Mesa 2',items:[
    {pid:menu[3].id,name:'Lomo saltado',price:38,qty:1,note:'Sin cebolla'},
    {pid:menu[7].id,name:'Chicha morada (jarra)',price:15,qty:1,note:''}
  ],openedAt:now()-12*60000,paid:0,aliases:[]};
  const t4={id:uid(),kind:'mesa',refs:[4],label:'Mesa 4',items:[
    {pid:menu[6].id,name:'Ceviche clásico',price:35,qty:1,note:''},
    {pid:menu[10].id,name:'Limonada',price:10,qty:2,note:'Sin azúcar'}
  ],openedAt:now()-40*60000,paid:0,aliases:[]};
  const orders=[
    {id:1,ticketId:t2.id,label:'Mesa 2',items:[{pid:menu[3].id,name:'Lomo saltado',price:38,qty:1,note:'Sin cebolla'}],note:'Sin cebolla',status:'cocina',source:'Mozo',alias:'Mesa',at:now()-12*60000},
    {id:2,ticketId:t2.id,label:'Mesa 2',items:[{pid:menu[7].id,name:'Chicha morada (jarra)',price:15,qty:1,note:''}],note:'',status:'listo',source:'Mozo',alias:'Mesa',at:now()-9*60000},
    {id:3,ticketId:t4.id,label:'Mesa 4',items:[{pid:menu[6].id,name:'Ceviche clásico',price:35,qty:1,note:''},{pid:menu[10].id,name:'Limonada',price:10,qty:2,note:'Sin azúcar'}],note:'',status:'servido',source:'Mozo',alias:'Mesa',at:now()-38*60000}
  ];
  tables[5].reserved={pax:4,at:'20:30'};
  return {menu,tables,tickets:{[t2.id]:t2,[t4.id]:t4},orders,sales:[],seq:4,settings:{qrPrepay:true,optionalAlias:true,theme:'light'}};
}
let S=load();
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.menu&&s.tables&&s.tickets)return s;
    return seed();
  }catch(e){return seed()}
}
const ch='BroadcastChannel' in window?new BroadcastChannel(KEY):null;
let undoSnap=null,toastT;
function persist(){localStorage.setItem(KEY,JSON.stringify(S));ch?.postMessage('sync')}
function save(msg,undoable=true){
  const prev=localStorage.getItem(KEY);
  persist();render();
  if(msg)toast(msg,undoable?prev:null);
}
ch&&(ch.onmessage=()=>{S=load();render();flash()});
addEventListener('storage',e=>{if(e.key===KEY){S=load();render();flash()}});
function flash(){const s=$('#sync');s.textContent='● Actualizado';setTimeout(()=>s.textContent='● Local',1200)}
function toast(msg,prev){
  $('#toastTxt').textContent=msg;undoSnap=prev;
  $('#undo').style.display=prev?'':'none';
  $('#toast').classList.add('on');clearTimeout(toastT);
  toastT=setTimeout(()=>$('#toast').classList.remove('on'),3500);
}
$('#undo').onclick=()=>{if(!undoSnap)return;localStorage.setItem(KEY,undoSnap);S=load();undoSnap=null;$('#toast').classList.remove('on');ch?.postMessage('sync');render()};

/* ---------- UI local ---------- */
let view=localStorage.getItem(KEY+'.view')||'salon';
let cur=null;      // {kind:'mesa',ref}|{kind:'llevar',tid?}|null (POS abierto)
let cart={};       // pid -> qty (borrador sin enviar)
let note='',itemNotes={},cat='Todo',q='',sheet=false;
let pay={method:'Efectivo',tid:null,cap:null,label:null};
let qrRef=null,qrCart={};
let orderMode=false,draftAlias='';

/* ---------- Helpers de dominio ---------- */
const ticketFor=(kind,ref)=>Object.values(S.tickets).find(t=>t.kind===kind&&(t.refs||[]).includes(ref));
const sum=items=>items.reduce((a,i)=>a+i.qty*i.price,0);
const prod=id=>S.menu.find(p=>p.id===id);
const cartItems=()=>Object.entries(cart).filter(([,q])=>q>0).map(([pid,qty])=>{const p=prod(pid);return{pid,name:p.name,price:p.price,qty,note:itemNotes[pid]||''}});
const curTicket=()=>!cur?null:cur.kind==='mesa'?ticketFor('mesa',cur.ref):(cur.tid?S.tickets[cur.tid]:null);
const readyOrders=tid=>S.orders.filter(o=>o.ticketId===tid&&o.status==='listo');
const activeOrders=tid=>S.orders.filter(o=>o.ticketId===tid&&o.status!=='servido');
const balance=tk=>Math.max(0,sum(tk.items)-(tk.paid||0));
const label=tk=>tk.kind==='llevar'?tk.label:tk.refs.length>1?`Mesas ${tk.refs.slice().sort((a,b)=>a-b).join('+')}`:`Mesa ${tk.refs[0]}`;
const tableState=t=>{
  if(t.reserved&&!ticketFor('mesa',t.id))return 'reservada';
  const tk=ticketFor('mesa',t.id);
  if(!tk)return 'libre';
  if(readyOrders(tk.id).length)return 'listo';
  if(balance(tk)>0&&!activeOrders(tk.id).length)return 'cobrar';
  return 'ocupada';
};


/* ---------- Render ---------- */
const STATE_LABEL={libre:'Libre',ocupada:'Ocupada',listo:'Listo para servir',cobrar:'Por cobrar',reservada:'Reservada'};
const SECONDARY=['qr','admin','settings'];
function render(){
  applyTheme();
  $('#salonConsumption').textContent=money(Object.values(S.tickets).filter(t=>t.kind==='mesa').reduce((n,t)=>n+balance(t),0));
  document.querySelectorAll('#nav button').forEach(b=>{
    const on=b.dataset.v===view||(b.dataset.v==='more'&&SECONDARY.includes(view));
    b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');
  });
  const k=S.orders.filter(o=>o.status==='cocina').length,r=S.orders.filter(o=>o.status==='listo').length;
  const cobrables=Object.values(S.tickets).filter(t=>balance(t)>0&&!activeOrders(t.id).length).length;
  $('#bKitchen').textContent=k||'';$('#bReady').textContent=r||'';$('#bCash').textContent=cobrables||'';
  const v=$('#view');
  if(view==='salon')v.innerHTML=cur?(orderMode?posView():tableDetailView()):salonView();
  else if(view==='mostrador'){if(!cur)cur={kind:'llevar',ref:null};v.innerHTML=posView()}
  else if(view==='cocina')v.innerHTML=kitchenView();
  else if(view==='caja')v.innerHTML=cashView();
  else if(view==='qr')v.innerHTML=qrView();
  else if(view==='admin')v.innerHTML=adminView();
  else if(view==='more')v.innerHTML=moreView();
  else v.innerHTML=settingsView();
  v.classList.toggle('has-bar',!!v.querySelector('.actbar,.fab'));
}
function applyTheme(){
  const th=S.settings.theme||'auto';
  if(th==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme=th;
}

/* ---------- Salón ---------- */
function salonView(){
  const F=localStorage.getItem(KEY+'.sf')||'Todas',Z=localStorage.getItem(KEY+'.sz')||'Todas',fq=localStorage.getItem(KEY+'.sq')||'';
  const sort=localStorage.getItem(KEY+'.sort')||'num';
  const states=[['Todas','Todas'],['libre','Libres'],['ocupada','Ocupadas'],['listo','Listos'],['cobrar','Por cobrar'],['reservada','Reservadas']];
  const unique=S.tables.filter(t=>{const tk=ticketFor('mesa',t.id);return !tk||tk.refs[0]===t.id});
  const count=k=>unique.filter(t=>k==='Todas'||tableState(t)===k).length;
  const priority=t=>{const st=tableState(t),tk=ticketFor('mesa',t.id);return (st==='listo'?5000:st==='cobrar'?4000:st==='ocupada'?3000:st==='reservada'?1000:0)+(tk?mins(tk.openedAt):0)};
  const list=unique.filter(t=>(F==='Todas'||tableState(t)===F)&&(Z==='Todas'||t.zone===Z)&&(!fq||(ticketFor('mesa',t.id)?.refs||[t.id]).some(id=>String(id).includes(fq)))).sort(sort==='prio'?(a,b)=>priority(b)-priority(a)||a.id-b.id:(a,b)=>a.id-b.id);
  const zones=[...new Set(S.tables.map(t=>t.zone))];
  const active=count('ocupada')+count('listo')+count('cobrar');
  const card=t=>{
    const tk=ticketFor('mesa',t.id),st=tableState(t),joined=tk&&tk.refs.length>1;
    const duration=tk?mins(tk.openedAt):0;
    const capacity=joined?tk.refs.reduce((n,id)=>n+(S.tables.find(x=>x.id===id)?.seats||0),0):t.seats;
    return `<article class="t ${st==='libre'?'free':''} ${st==='listo'?'ready':''} ${joined?'joined':''}" style="--c:var(--${st})">
      <button class="table-open" data-table="${t.id}" aria-label="${esc(tk?label(tk):'Mesa '+t.id)}, ${STATE_LABEL[st]}">
        ${joined?`<span class="subs">${tk.refs.map((r,k)=>`<span class="${k?'':'m'}">${r}</span>`).join('')}</span>`:`<b>Mesa ${t.id}</b>`}
        <span class="cap">${capacity} asientos</span>
        <span class="st">${STATE_LABEL[st]}</span>
        ${tk?`<span class="amt num">${money(balance(tk))} · <span class="elapsed ${duration>=45?'late':duration>=30?'warn':''}">${duration} min</span></span>`:st==='reservada'?`<span class="amt">${esc(t.reserved.at)} · ${t.reserved.pax} personas</span>`:''}
      </button>
    </article>`;
  };
  return `<div class="page-head"><div><h1>Mesas</h1><p>${active} atencion${active===1?'':'es'} activa${active===1?'':'s'} · ${count('libre')} libre${count('libre')===1?'':'s'}</p></div></div>
    <div class="salon-tools">
      <div class="scroll-x status-filters" role="group" aria-label="Filtrar por estado">${states.map(([k,l])=>`<button class="chip ${F===k?'on':''}" data-sf="${k}" aria-pressed="${F===k}" ${k!=='Todas'?`style="--c:var(--${k})"`:''}>${k!=='Todas'?'<i aria-hidden="true"></i>':''}${l}<span class="n">${count(k)}</span></button>`).join('')}</div>
      <div class="toolbar">
        <input class="search" id="sq" type="search" inputmode="numeric" placeholder="Buscar mesa por número…" value="${esc(fq)}" aria-label="Buscar mesa">
        <select class="select" id="salonZone" aria-label="Filtrar zona">${['Todas',...zones].map(z=>`<option value="${esc(z)}" ${Z===z?'selected':''}>${z==='Todas'?'Todas las zonas':esc(z)}</option>`).join('')}</select>
        <button class="btn" data-a="sort-tables" aria-label="Cambiar orden">↕ ${sort==='num'?'Número':'Prioridad'}</button>
      </div>
    </div>
    ${list.length?zones.filter(z=>list.some(t=>t.zone===z)).map(z=>{const zl=list.filter(t=>t.zone===z);return `<section class="zone-section" aria-label="${esc(z)}"><div class="zone-heading"><h2>${esc(z)}</h2><span>${zl.length} mesa${zl.length===1?'':'s'}</span></div><div class="tables">${zl.map(card).join('')}</div></section>`}).join(''):'<div class="empty">No hay mesas con estos filtros.</div>'}`;
}

/* ---------- Detalle de mesa ---------- */
function splitGroups(tk){
  const groups={};
  S.orders.filter(o=>o.ticketId===tk.id).forEach(o=>{const a=o.alias||'Mesa';groups[a]=(groups[a]||0)+sum(o.items)});
  const covered=Object.values(groups).reduce((a,b)=>a+b,0);
  // Lo ya pagado se descuenta proporcionalmente para no cobrar dos veces.
  const factor=covered>0?Math.min(1,balance(tk)/covered):0;
  Object.keys(groups).forEach(k=>groups[k]=Math.round(groups[k]*factor*100)/100);
  return Object.entries(groups).filter(([,v])=>v>0.009);
}
function tableDetailView(){
  const tk=curTicket(),t=S.tables.find(x=>x.id===cur.ref);
  if(!t){cur=null;return salonView()}
  const st=tableState(t);
  const orders=tk?S.orders.filter(o=>o.ticketId===tk.id):[];
  const statusText={cocina:'En cocina',listo:'Listo',servido:'Entregado'};
  const statusColor={cocina:'ocupada',listo:'listo',servido:'libre'};
  const bal=tk?balance(tk):0;
  const headAct=!tk?(t.reserved?'<button class="btn sm danger" data-a="unreserve">Quitar reserva</button>':'<button class="btn sm" data-a="reserve">Reservar</button>'):'';
  return `<div class="detail-head">
    <button class="btn ghost icon" data-a="back" aria-label="Volver al salón">←</button>
    <div style="min-width:0"><h2>${tk?esc(label(tk)):`Mesa ${t.id}`}</h2><div class="state-line" style="--c:var(--${st})">${STATE_LABEL[st]}${t.reserved&&!tk?` · ${esc(t.reserved.at)} · ${t.reserved.pax} personas`:''}</div></div>
    ${headAct}
  </div>
  <div class="detail">
    <section class="orders">${orders.length?orders.map(o=>`<article class="order">
        <div class="order-head">
          <div style="min-width:0"><div class="order-who"><span>${esc(o.alias&&o.alias!=='Mesa'?o.alias:'Mesa')}</span>${S.settings.optionalAlias?`<button class="btn ghost sm" data-rename="${o.id}" aria-label="Editar nombre">✎</button>`:''}</div><div class="mut">#${o.id} · ${hhmm(o.at)}${o.source==='QR'?' · 📱 QR':''}</div></div>
          <span class="tag" style="--c:var(--${statusColor[o.status]||'ocupada'})">${statusText[o.status]||o.status}</span>
        </div>
        <div class="order-items">${o.items.map(i=>`<div class="order-item"><span>${i.qty} × ${esc(i.name)}${i.note?` <em>— ${esc(i.note)}</em>`:''}</span><strong class="num">${money(i.qty*i.price)}</strong></div>`).join('')}</div>
        ${o.note?`<div class="nt">📝 ${esc(o.note)}</div>`:''}

/* ---------- Acciones de dominio ---------- */
function ensureTicket(){
  let tk=cur.kind==='mesa'?ticketFor('mesa',cur.ref):(cur.tid&&S.tickets[cur.tid]);
  if(!tk){
    const id=uid();
    tk=S.tickets[id]={id,kind:cur.kind,refs:cur.kind==='mesa'?[cur.ref]:[],label:cur.kind==='mesa'?`Mesa ${cur.ref}`:`Llevar #${S.seq}`,items:[],openedAt:now(),paid:0,aliases:[]};
    if(cur.kind==='llevar')cur.tid=id;
    else{const t=S.tables.find(x=>x.id===cur.ref);if(t)t.reserved=null}
  }
  return tk;
}
function sendDraft(){
  const items=cartItems();if(!items.length)return null;
  const tk=ensureTicket();
  items.forEach(i=>{const ex=tk.items.find(x=>x.pid===i.pid&&x.price===i.price);ex?ex.qty+=i.qty:tk.items.push({...i})});
  const alias=cur.kind==='mesa'?(draftAlias.trim()||'Mesa'):($('#orderAlias')?.value||'Mesa');
  if(alias!=='Mesa'&&!tk.aliases.includes(alias))tk.aliases.push(alias);
  S.orders.push({id:S.seq++,ticketId:tk.id,label:label(tk),items,note:note.trim(),status:'cocina',source:'Mozo',alias,at:now()});
  cart={};note='';itemNotes={};
  return tk;
}
function serveReady(tid){readyOrders(tid).forEach(o=>o.status='servido')}
function anularTicket(tid){
  const tk=S.tickets[tid];if(!tk)return null;
  S.orders=S.orders.filter(o=>o.ticketId!==tid);
  delete S.tickets[tid];
  return tk;
}

/* ---------- Cobro ---------- */
function openPay(tid,opts={}){
  let tk=tid?S.tickets[tid]:null;
  if(!tk){
    if(cur&&cur.kind==='llevar')tk=sendDraft();
    if(!tk){toast('No hay nada que cobrar');return}
  }
  pay={method:'Efectivo',tid:tk.id,cap:opts.cap??balance(tk),label:opts.label??label(tk)};
  sheet=false;render();
  $('#payT').textContent=`Cobrar · ${pay.label}`;
  $('#payTotal').textContent=money(pay.cap);
  $('#payPartial').textContent=pay.cap<balance(tk)-0.009?`Pago parcial de una cuenta de ${money(balance(tk))}`:'';
  $('#cashIn').value='';
  const t=pay.cap;
  $('#cashQuick').innerHTML=[...new Set([t,Math.ceil(t/10)*10,Math.ceil(t/50)*50,100,200].filter(v=>v>=t))].slice(0,4).map(v=>`<button class="chip" data-cash="${v}">${money(v)}</button>`).join('');
  payUI();$('#payBack').classList.add('on');
}
function payUI(){
  const tk=S.tickets[pay.tid];if(!tk)return;
  $('#payMethods').innerHTML=METHODS.map(m=>`<button class="${m===pay.method?'on':''}" data-m="${m}">${m}</button>`).join('');
  $('#cashBox').style.display=pay.method==='Efectivo'?'':'none';
  const r=parseFloat($('#cashIn').value),t=pay.cap;
  $('#change').innerHTML=pay.method==='Efectivo'&&r?(r>=t?`Vuelto: <b class="num">${money(r-t)}</b>`:`<span style="color:var(--bad)">Faltan ${money(t-r)}</span>`):'';
  $('#payOk').disabled=pay.method==='Efectivo'&&r>0&&r<t;
}
function confirmPay(){
  const tk=S.tickets[pay.tid];if(!tk)return;
  const t=pay.cap;
  if(pay.method==='Efectivo'){
    const r=parseFloat($('#cashIn').value)||0;
    if(r<t){toast(`Faltan ${money(t-r)} en efectivo`);return}
  }
  const partial=t<balance(tk)-0.009;
  const saleLabel=partial?`${label(tk)} · ${pay.label}`:label(tk);
  S.sales.push({id:uid(),label:saleLabel,total:t,method:pay.method,at:now(),items:tk.items.map(i=>({name:i.name,price:i.price,qty:partial?0:i.qty})),partial});
  tk.paid=(tk.paid||0)+t;
  const closed=balance(tk)<=0.009;
  if(closed){
    S.orders.forEach(o=>{if(o.ticketId===tk.id&&o.status==='listo')o.status='servido'});
    delete S.tickets[tk.id];
  }
  $('#payBack').classList.remove('on');
  if(cur&&cur.kind==='mesa'&&closed)cur=null;
  if(view==='mostrador'&&closed)cur={kind:'llevar',ref:null};
  save(`${saleLabel} cobrada · ${money(t)} (${pay.method})${closed?'':` · queda ${money(balance(tk))}`}`);
}

/* ---------- Unión / separación ---------- */
function mergeTickets(mainId,otherId){
  const m=S.tickets[mainId],o=S.tickets[otherId];
  if(!m||!o||mainId===otherId)return;
  o.items.forEach(i=>{const ex=m.items.find(x=>x.pid===i.pid&&x.price===i.price);ex?ex.qty+=i.qty:m.items.push({...i})});
  m.refs.push(...o.refs.filter(r=>!m.refs.includes(r)));
  m.paid=(m.paid||0)+(o.paid||0);
  m.aliases.push(...o.aliases.filter(a=>!m.aliases.includes(a)));
  S.orders.forEach(ord=>{if(ord.ticketId===otherId){ord.ticketId=mainId;ord.label=label(m)}});
  delete S.tickets[otherId];
  m.label=label(m);
}
function separateRef(tid,ref){
  const tk=S.tickets[tid];if(!tk||tk.refs.length<2)return;
  tk.refs=tk.refs.filter(r=>r!==ref);
  tk.label=label(tk);
}

/* ---------- QR: enviar / pagar ---------- */
function sendQR(){
  const items=Object.entries(qrCart).filter(([,q])=>q>0).map(([pid,qty])=>{const p=prod(pid);return{pid,name:p.name,price:p.price,qty,note:''}});
  if(!items.length)return;
  const t=S.tables.find(x=>x.id===qrRef);
  let tk=ticketFor('mesa',qrRef);
  if(!tk){const id=uid();tk=S.tickets[id]={id,kind:'mesa',refs:[qrRef],label:`Mesa ${qrRef}`,items:[],openedAt:now(),paid:0,aliases:[]}}
  items.forEach(i=>{const ex=tk.items.find(x=>x.pid===i.pid&&x.price===i.price);ex?ex.qty+=i.qty:tk.items.push({...i})});
  S.orders.push({id:S.seq++,ticketId:tk.id,label:label(tk),items,note:'',status:'cocina',source:'QR',alias:'Mesa',at:now()});
  qrCart={};
  if(S.settings.qrPrepay){
    S.sales.push({id:uid(),label:label(tk),total:sum(items),method:'QR prepago',at:now(),items,partial:false});
    delete S.tickets[tk.id];
    return save(`QR Mesa ${qrRef}: pagado y enviado · ${money(sum(items))}`);
  }
  return save(`QR Mesa ${qrRef}: pedido enviado a cocina`);
}

/* ---------- Cobrar: total directo o por comensal ---------- */
function chargeTable(tid){
  const tk=S.tickets[tid];if(!tk)return;
  const groups=S.settings.optionalAlias?splitGroups(tk):[];
  if(groups.length<2)return openPay(tid);
  $('#splitT').textContent=`Cobrar · ${label(tk)}`;
  $('#splitBody').innerHTML=`<div class="splitrows">
      <button class="btn pri" data-splitpay="${tk.id}|full"><span>Toda la cuenta</span><span class="num">${money(balance(tk))}</span></button>
      <div class="mut" style="margin-top:6px">O cobra por persona:</div>
      ${groups.map(([a,v])=>`<button class="btn" data-splitpay="${tk.id}|${esc(a)}|${v}"><span>${esc(a==='Mesa'?'Sin nombre':a)}</span><span class="num">${money(v)}</span></button>`).join('')}
    </div>`;
  $('#splitBack').classList.add('on');
}

/* ---------- Navegación ---------- */
function canLeaveDraft(){
  return !Object.values(cart).some(q=>q>0)||confirm('Tienes productos sin enviar. ¿Descartarlos y continuar?');
}
function resetDraft(){cart={};note='';itemNotes={};q='';cat='Todo';sheet=false}
function nextAlias(ref){const tk=ticketFor('mesa',ref);return `Persona ${(tk?S.orders.filter(o=>o.ticketId===tk.id).length:0)+1}`}
function beginPersonOrder(ref){
  if(!canLeaveDraft())return;
  resetDraft();cur={kind:'mesa',ref};orderMode=true;
  draftAlias=S.settings.optionalAlias?nextAlias(ref):'';
  render();scrollTo(0,0);
}
function goBack(){
  if(!canLeaveDraft())return;
  resetDraft();
  if(view==='salon'&&orderMode){orderMode=false;return render()}
  if(view==='mostrador'){view='salon';localStorage.setItem(KEY+'.view',view)}
  cur=null;orderMode=false;render();
}
function closeModals(){let c=false;['#payBack','#splitBack','#joinBack'].forEach(s=>{if($(s).classList.contains('on')){$(s).classList.remove('on');c=true}});return c}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList?.contains('back')){e.target.classList.remove('on');return}
  const b=e.target.closest('button,[data-a]');if(!b)return;
  const d=b.dataset;
  if(d.rename){
    const o=S.orders.find(x=>x.id==d.rename);if(!o)return;
    const n=prompt('Nombre de la persona (opcional):',o.alias==='Mesa'?'':o.alias);if(n===null)return;
    o.alias=n.trim().replace(/\|/g,'')||'Mesa';const tk=S.tickets[o.ticketId];if(tk&&o.alias!=='Mesa'&&!tk.aliases.includes(o.alias))tk.aliases.push(o.alias);
    return save('Nombre actualizado');
  }
  if(d.joinref){
    const tk=curTicket();if(!tk)return;const ref=+d.joinref;
    const other=ticketFor('mesa',ref);
    if(other)mergeTickets(tk.id,other.id);
    else{tk.refs.push(ref);const tt=S.tables.find(x=>x.id===ref);if(tt)tt.reserved=null}
    tk.refs.sort((a,b)=>a-b);tk.label=label(tk);
    cur.ref=tk.refs[0];
    $('#joinBack').classList.remove('on');
    return save(`Mesa ${ref} unida · ${label(tk)}`);
  }
  if(d.splitpay){
    const [tid,al,am]=d.splitpay.split('|');
    $('#splitBack').classList.remove('on');
    if(al==='full')return openPay(tid);
    return openPay(tid,{cap:Math.min(Number(am),balance(S.tickets[tid])),label:al==='Mesa'?'Sin nombre':al});
  }
  if(d.v){
    if(!canLeaveDraft())return;
    view=d.v;localStorage.setItem(KEY+'.view',view);cur=null;orderMode=false;resetDraft();
    render();return scrollTo(0,0);
  }
  if(d.sf){localStorage.setItem(KEY+'.sf',d.sf);return render()}
  if(d.table){cur={kind:'mesa',ref:+d.table};orderMode=false;resetDraft();render();return scrollTo(0,0)}
  if(d.add){cart[d.add]=(cart[d.add]||0)+1;return render()}
  if(d.dec){cart[d.dec]=Math.max(0,(cart[d.dec]||0)-1);if(!cart[d.dec]){delete cart[d.dec];delete itemNotes[d.dec]}if(!cartItems().length&&!curTicket())sheet=false;return render()}
  if(d.note){
    const p=prod(d.note);
    const n=prompt(`Nota para ${p.name} (vacío = quitar):`,itemNotes[d.note]||'');
    if(n===null)return;
    if(n.trim())itemNotes[d.note]=n.trim();else delete itemNotes[d.note];
    return render();
  }
  if(d.cat){cat=d.cat;return render()}
  if(d.ready){const o=S.orders.find(x=>x.id==d.ready);if(o){o.status='listo';return save(`Pedido #${o.id} listo · ${o.label}`)}return}
  if(d.served){const o=S.orders.find(x=>x.id==d.served);if(o){o.status='servido';return save(`Pedido #${o.id} entregado`)}return}
  if(d.m){pay.method=d.m;return payUI()}
  if(d.cash){$('#cashIn').value=d.cash;return payUI()}
  if(d.del){const p=prod(d.del);if(!p||!confirm(`¿Eliminar ${p.name} de la carta?`))return;S.menu=S.menu.filter(x=>x.id!==d.del);delete cart[d.del];return save(`${p.name} eliminado`)}
  if(d.sep){
    const tk=curTicket();if(!tk)return;
    if(!confirm(`¿Separar Mesa ${d.sep} del grupo? El consumo queda en la mesa principal.`))return;
    separateRef(tk.id,+d.sep);
    return save(`Mesa ${d.sep} separada`);
  }
  if(d.theme){S.settings.theme=d.theme;return save(null)}
  if(d.tog){S.settings[d.tog]=!S.settings[d.tog];return save(`${d.tog==='qrPrepay'?'Prepago QR':'Nombre por comensal'}: ${S.settings[d.tog]?'activado':'desactivado'}`)}
  if(d.qdec){qrCart[d.qdec]=Math.max(0,(qrCart[d.qdec]||0)-1);if(!qrCart[d.qdec])delete qrCart[d.qdec];return render()}
  if(d.qadd){qrCart[d.qadd]=(qrCart[d.qadd]||0)+1;return render()}
  switch(d.a){
    case'cash-pay':return chargeTable(d.tid);
    case'cash-ver':{
      const tk=S.tickets[d.tid];if(!tk)return;
      if(tk.kind==='llevar'){view='mostrador';cur={kind:'llevar',ref:null,tid:tk.id}}
      else{view='salon';cur={kind:'mesa',ref:tk.refs[0]}}
      localStorage.setItem(KEY+'.view',view);orderMode=false;resetDraft();render();return scrollTo(0,0);
    }
    case'back':return goBack();
    case'person-order':{const t=S.tables.find(x=>x.id===cur.ref);if(t?.reserved&&!ticketFor('mesa',t.id)&&!confirm(`Mesa ${t.id} reservada para ${t.reserved.pax} a las ${t.reserved.at}. ¿Iniciar pedido?`))return;return beginPersonOrder(cur.ref)}
    case'edit-person':{
      const n=prompt('Nombre de la persona (opcional):',draftAlias.startsWith('Persona ')?'':draftAlias);if(n===null)return;
      draftAlias=n.trim().replace(/\|/g,'')||nextAlias(cur.ref);return render();
    }
    case'sheet-open':sheet=true;return render();
    case'sheet-close':sheet=false;return render();
    case'send':{
      if(!cartItems().length){toast('Toca productos para armar el pedido');return}
      const tk=sendDraft();sheet=false;if(cur.kind==='mesa')orderMode=false;
      return save(`Enviado a cocina · ${label(tk)}`);
    }
    case'charge':return openPay(curTicket()?.id||null);
    case'charge-table':{const tk=curTicket();if(tk)chargeTable(tk.id);return}
    case'clear':if(!confirm('¿Vaciar el pedido nuevo?'))return;cart={};note='';itemNotes={};sheet=false;return render();
    case'served':{const tk=curTicket();if(!tk)return;const n=readyOrders(tk.id).length;serveReady(tk.id);return save(`${n} pedido${n>1?'s':''} entregado${n>1?'s':''}`)}
    case'void':{
      const tk=curTicket();if(!tk)return;
      if(!confirm(`¿Anular ${label(tk)}? No se registrará venta.`))return;
      const l=label(tk);anularTicket(tk.id);
      cur=view==='mostrador'?{kind:'llevar',ref:null}:null;sheet=false;
      return save(`${l} anulada`);
    }
    case'reserve':{
      const t=S.tables.find(x=>x.id===cur.ref);
      const n=prompt('¿Cuántas personas?',String(t.seats));if(n===null)return;
      const h=prompt('¿A qué hora? (HH:MM)',hhmm(now()+3600000));if(h===null)return;
      t.reserved={pax:Math.max(1,parseInt(n)||1),at:(h.trim()||hhmm(now()))};
      return save(`Mesa ${t.id} reservada para ${t.reserved.pax} · ${t.reserved.at}`);
    }
    case'unreserve':{
      const t=S.tables.find(x=>x.id===cur.ref);
      if(!confirm('¿Quitar la reserva?'))return;
      t.reserved=null;
      return save(`Reserva de Mesa ${t.id} quitada`);
    }
    case'join-other':{
      const tk=curTicket();if(!tk)return;
      const otros=S.tables.filter(t=>!tk.refs.includes(t.id));
      $('#joinList').innerHTML=otros.map(t=>{
        const o=ticketFor('mesa',t.id);
        return `<button class="btn" data-joinref="${t.id}"><span>Mesa ${t.id} · ${esc(t.zone)}</span><span class="mut">${o?`${esc(label(o))} · ${money(balance(o))}`:t.reserved?'reservada':'libre'}</span></button>`;
      }).join('')||'<div class="empty">No hay otras mesas.</div>';
      $('#joinBack').classList.add('on');
      return;
    }
    case'join-close':case'split-close':case'pay-close':return closeModals();
    case'pay-ok':return confirmPay();
    case'sort-tables':localStorage.setItem(KEY+'.sort',(localStorage.getItem(KEY+'.sort')||'num')==='num'?'prio':'num');return render();
    case'add-prod':S.menu.push({id:uid(),cat:'Nuevos',name:'Nuevo producto',price:10,on:true});return save('Producto agregado',false);
    case'tbl+':{const id=Math.max(0,...S.tables.map(t=>t.id))+1;S.tables.push({id,zone:S.tables.at(-1)?.zone||'Salón',seats:S.tables.at(-1)?.seats||4,reserved:null});return save(`Mesa ${id} agregada`)}
    case'tbl-':{
      const last=S.tables.at(-1);if(!last)return;
      if(ticketFor('mesa',last.id))return toast(`La mesa ${last.id} tiene una cuenta abierta`);
      S.tables.pop();if(qrRef===last.id)qrRef=null;return save(`Mesa ${last.id} quitada`);
    }
    case'reset':if(confirm('¿Borrar carta, ventas y cuentas? Esto no se puede deshacer.')){S=seed();cur=null;resetDraft();qrCart={};save('Datos reiniciados',false)}return;
    case'qr-send':return sendQR();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const el=$('#q');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}}
  if(e.target.id==='sq'){localStorage.setItem(KEY+'.sq',e.target.value);const pos=e.target.selectionStart;render();const el=$('#sq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}}
  if(e.target.id==='note')note=e.target.value;
  if(e.target.id==='cashIn')payUI();
});
document.addEventListener('change',e=>{
  const d=e.target.dataset||{};
  if(e.target.id==='salonZone'){localStorage.setItem(KEY+'.sz',e.target.value);return render()}
  if(e.target.id==='qrSel'){qrRef=+e.target.value;qrCart={};return render()}
  if(d.edit){const p=prod(d.edit);if(!p)return;p[d.f]=d.f==='price'?Math.max(0,parseFloat(e.target.value)||0):(e.target.value||'').trim()||p[d.f];return save(null)}
  if(d.toggle){const p=prod(d.toggle);if(!p)return;p.on=e.target.checked;if(!p.on)delete cart[p.id];return save(`${p.name} ${p.on?'disponible':'agotado'}`)}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(closeModals())return;
  if(sheet){sheet=false;return render()}
  if(cur&&!(view==='mostrador'&&!cur.tid))goBack();
});
setInterval(()=>{if(!['admin','settings','more'].includes(view)&&!document.activeElement?.matches('input,textarea,select')&&!document.querySelector('.back.on'))render()},30000);
render();
</script>
</body>
</html>
