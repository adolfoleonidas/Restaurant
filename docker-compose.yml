services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-restaurant_db}
      APP_ENV: ${APP_ENV:-production}
      SEED_DEMO: ${SEED_DEMO:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique value of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public site origin}

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mongo-data:
