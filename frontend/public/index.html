<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <!-- Sin maximum-scale: bloquear el zoom impedía ampliar un ticket o un
             precio en el móvil (hallazgo P1-1 de la auditoría). viewport-fit=cover
             habilita las áreas seguras env(safe-area-inset-*) del notch. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- El color de la barra del navegador sigue al tema real de la app
             (--background de index.css en claro y en oscuro). -->
        <meta name="theme-color" content="#F8F9FB" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#131720" media="(prefers-color-scheme: dark)" />
        <meta name="description" content="Sistema de gestión para restaurantes: salón, cocina, caja, pedidos en línea y carta digital." />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Sabor Peruano" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon-180.png" />
        <!-- Las tres familias que la app usa de verdad (Instrument Sans para el
             texto, Bricolage Grotesque para los títulos e IBM Plex Mono para
             importes). Antes se cargaban aquí Inter + IBM Plex Mono y además
             un @import en index.css con las otras dos: cinco familias en dos
             peticiones en serie. display=swap evita el texto invisible. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <title>Sabor Peruano</title>
        <script>try{if(localStorage.getItem('restaurant-dark-mode')==='true')document.documentElement.classList.add('dark')}catch(e){}</script>
    </head>
    <body>
        <noscript>Necesitás JavaScript para usar esta aplicación.</noscript>
        <div id="root"></div>
    </body>
</html>
