# Edge rate limiting (T3). These live in the http context because conf.d/*.conf
# is included there.
#
# The limit key is empty for every request that is not a target, and nginx does
# not count requests with an empty key, so one `location /api/` block (and one
# proxy configuration) serves all of /api/ without duplicating it per path.
#   - login: brute force against /api/auth/login (the optional trailing slash is
#     tolerated because FastAPI redirects it to the canonical path).
#   - public: the unauthenticated surface (menu, tracking, orders, prepay).
# Keyed by client address ($binary_remote_addr). Everyone on the venue's Wi-Fi
# shares one address, so these are flood guards sized well above real use, not
# per-customer quotas; the per-account lockout lives in routes/auth.py.
# If a CDN or load balancer is ever put in front of this nginx, every client
# will share ITS address: add ngx_http_realip_module (set_real_ip_from) first.
map $uri $login_limit_key {
    default                       "";
    ~^/api/auth/login/?$          $binary_remote_addr;
}
map $uri $public_limit_key {
    default                       "";
    ~^/api/public(-prepay)?/      $binary_remote_addr;
}
limit_req_zone $login_limit_key  zone=login_per_ip:10m  rate=5r/m;
limit_req_zone $public_limit_key zone=public_per_ip:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir el texto es la mayor diferencia en datos móviles: el bundle de
    # JavaScript baja de ~1 MB a ~350 KB y la carta pública se abre antes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        # Login: 5 attempts/min per address after a burst of 10 (a whole shift can
        # sign in at once from the venue's shared address). Public: 120/min, burst 60.
        limit_req zone=login_per_ip burst=10 nodelay;
        limit_req zone=public_per_ip burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE (not append) the header: the backend trusts proxy headers from
        # this container (uvicorn --forwarded-allow-ips) and reads the address
        # from X-Forwarded-For, so a value sent by the client must never reach it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Un favicon que no existe no debe devolver el index.html con un 200: el
    # navegador se queda con HTML donde esperaba una imagen.
    location = /favicon.ico {
        try_files $uri =404;
    }

    # El service worker no se cachea nunca: si el navegador se queda con una
    # copia, la app deja de recibir actualizaciones (no-store además de
    # revalidar, para que ni la búsqueda de actualización use caché).
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # El index tampoco: es el que apunta a los archivos con hash de esta versión.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los archivos de /static/ llevan el hash del contenido en el nombre, así que
    # son inmutables y se pueden cachear un año.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
