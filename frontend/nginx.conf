server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir el texto es la mayor diferencia en datos móviles: el bundle de
    # JavaScript baja de ~1 MB a ~350 KB y la carta pública se abre antes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Un favicon que no existe no debe devolver el index.html con un 200: el
    # navegador se queda con HTML donde esperaba una imagen.
    location = /favicon.ico {
        try_files $uri =404;
    }

    # El service worker no se cachea nunca: si el navegador se queda con una
    # copia, la app deja de recibir actualizaciones.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # El index tampoco: es el que apunta a los archivos con hash de esta versión.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los archivos de /static/ llevan el hash del contenido en el nombre, así que
    # son inmutables y se pueden cachear un año.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
