# HTTPS for the public site and the panel.
#
# Enable it with the override file (the plain docker-compose.yml keeps working
# without certificates):
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Certificates must be present in ./certs as fullchain.pem + privkey.pem.
# See "HTTPS" in docs/day-one-runbook.md.

server {
    listen 80;
    server_name _;
    # With certificates in place there is no reason to serve anything over HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir el texto es la mayor diferencia en datos móviles: el bundle de
    # JavaScript baja de ~1 MB a ~350 KB y la carta pública se abre antes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Un favicon que no existe no debe devolver el index.html con un 200.
    location = /favicon.ico {
        try_files $uri =404;
    }

    # El service worker no se cachea nunca: si el navegador se queda con una
    # copia, la app deja de recibir actualizaciones.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # El index tampoco: es el que apunta a los archivos con hash de esta versión.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los archivos de /static/ llevan el hash del contenido en el nombre.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
