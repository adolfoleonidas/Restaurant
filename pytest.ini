[pytest]
# Run from the repository root:
#   python -m pytest tests -m "not integration"   # hermetic suite (CI)
#   python -m pytest tests                        # everything (needs the stack up)
#
# `pythonpath` makes the backend modules importable without cd-ing into backend/.
pythonpath = backend
testpaths = tests

markers =
    integration: talks to a live API and a seeded database (needs `docker compose up`)
